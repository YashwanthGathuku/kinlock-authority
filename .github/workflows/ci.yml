name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m pip install "ruff==0.17.*" && ruff check .
      - name: Test
        run: pytest -q
      - name: Example leaves the tree clean
        run: python examples/quickstart.py && git diff --exit-code && test -z "$(git status --porcelain)"
      - name: Example runs
        run: python examples/quickstart.py
      - name: Conformance vectors are up to date
        if: matrix.python-version == '3.12'
        run: |
          python conformance/generate_vectors.py
          git diff --exit-code -- conformance/vectors

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (wasm32)
        run: cargo clippy --locked -p kinlock-authority-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Test (unit, all conformance vectors, voice proptest)
        run: cargo test --release --locked -- --nocapture
      - name: Build WebAssembly module
        run: |
          cargo build --release --locked -p kinlock-authority-wasm --target wasm32-unknown-unknown
          sha256sum target/wasm32-unknown-unknown/release/kinlock_authority_wasm.wasm
