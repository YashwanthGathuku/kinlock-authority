[project]
name = "kinlock-authority"
version = "0.1.0"
description = "Deterministic authority for actions an AI assistant asks to take: authority direction, exact-action approvals, hash-chained receipts. No dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yashwanth Gathuku" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
